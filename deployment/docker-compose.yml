services:
  db:
    image: pgvector/pgvector:pg16
    container_name: banking_assurance_db
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from the root .env —
    # the same file the app reads, so both sides always agree. (Compose's own
    # ${VAR} interpolation does not read ../.env when run with
    # `-f deployment/docker-compose.yml`, which previously left the app on a
    # placeholder password.) PostgreSQL applies these only when the volume is
    # first created; afterwards .env must keep matching the stored password.
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Localhost only: the database is never reachable from other computers.
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: banking_assurance_app
    env_file:
      - ../.env
    # Blank the host-side DATABASE_URL / ALLOWED_SCAN_PATHS from .env so that
    # core/config.py builds them from POSTGRES_* (host "db") and
    # DOCKER_ALLOWED_SCAN_PATHS — the same .env values the db service uses.
    # Applies to every process in the container, including
    # `docker compose exec app python -m scripts...`.
    environment:
      DATABASE_URL: ""
      ALLOWED_SCAN_PATHS: ""
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    # Host access: http://localhost:8085 (localhost only). Streamlit listens on
    # 8501 inside the container. Plain HTTP — configure HTTPS (TLS-terminating
    # reverse proxy) before binding this to any other interface. See README.md.
    ports:
      - "127.0.0.1:8085:8501"
    volumes:
      - ../mock_banking_system:/scan-targets/mock_banking_system:ro
      - ../reference_banking_system:/scan-targets/reference_banking_system:ro
      # Optional additional Windows scan target (read-only):
      # - C:/Projects/TargetBankingSystem:/scan-targets/target-system:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5).read()\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
