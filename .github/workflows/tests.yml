name: tests

# Runs the test suite without Docker or an external database. Tests that
# need a live PostgreSQL server (tests/integration/test_postgres_*.py) and
# the legacy-repository immutability checks skip themselves explicitly in
# this environment; everything else runs against temporary SQLite files.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q -rs
