<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1040" width="1900" height="1040" role="img" aria-labelledby="svgTitle svgDesc">
<title id="svgTitle">Banking Systems Assurance Platform — Architecture</title>
<desc id="svgDesc">A target banking source is ingested through path and archive safety validation, then scanned by eight deterministic scanning engines and mapped to banking domains within the Assessment Engine orchestrator. Results are persisted through a repository layer to PostgreSQL, then scored, control-evaluated, reviewed under a governance finalization gate, and recorded in an append-only audit trail. A Streamlit UI exposes the workflow, exports, and a help panel. A separate, dashed-boundary Optional AI Advisory Layer may read already-persisted findings and scores read-only and can only write an advisory audit event — it never modifies findings, scores, control evaluations, or audit/compliance state.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0b2545"/>
  </marker>
  <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f8fc0"/>
  </marker>
  <marker id="arrowGray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8a97a3"/>
  </marker>
  <style>
    text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;}
    .title{font-weight:700;fill:#0b2545;}
    .cap{fill:#4b5763;}
    .file{fill:#8a97a3;font-style:italic;}
    .navyTxt{fill:#0b2545;}
    .cyanTxt{fill:#1f8fc0;}
    .greenTxt{fill:#1f7a45;}
    .grayTxt{fill:#7a8794;}
    .edge{fill:#3a4753;}
    .box{fill:#ffffff;stroke:#0b2545;stroke-width:1.75;}
    .flow{stroke:#0b2545;stroke-width:2;fill:none;marker-end:url(#arrow);}
    .flowBi{stroke:#0b2545;stroke-width:2;fill:none;marker-end:url(#arrow);marker-start:url(#arrow);}
    .append{stroke:#0b2545;stroke-width:1.5;fill:none;stroke-dasharray:2 3;marker-end:url(#arrow);}
    .advisory{stroke:#1f8fc0;stroke-width:2;fill:none;stroke-dasharray:7 4;marker-end:url(#arrowCyan);}
    .readback{stroke:#8a97a3;stroke-width:1.3;fill:none;stroke-dasharray:3 3;marker-end:url(#arrowGray);}
  </style>
</defs>

<rect x="0" y="0" width="1900" height="1040" fill="#ffffff"/>

<!-- Title -->
<text x="50" y="42" font-size="26" class="title">Banking Systems Assurance Platform — Architecture</text>
<text x="50" y="64" font-size="13" class="cap">Deterministic assessment core with an optional, advisory-only AI layer · reference diagram, not a production topology</text>

<!-- External target -->
<rect x="80" y="90" width="300" height="64" rx="10" class="box"/>
<text x="230" y="114" font-size="13" text-anchor="middle" class="title">Banking Source Under Assessment</text>
<text x="230" y="130" font-size="10" text-anchor="middle" class="cap">Local directory or ZIP archive</text>
<text x="230" y="144" font-size="9" text-anchor="middle" class="file">governance/file_validation.py</text>
<path d="M230,154 L230,290" class="flow"/>

<!-- Trusted Deterministic Core boundary -->
<rect x="40" y="190" width="1460" height="730" rx="18" fill="#0b2545" fill-opacity="0.035" stroke="#0b2545" stroke-width="2.5"/>
<text x="64" y="218" font-size="15" font-weight="700" class="navyTxt" letter-spacing="0.4">TRUSTED DETERMINISTIC CORE</text>
<text x="64" y="234" font-size="10.5" class="cap">Produces every finding, score, control evaluation and report; no external network or AI provider required</text>

<!-- Assessment Engine dashed sub-boundary -->
<rect x="70" y="250" width="1220" height="260" rx="14" fill="none" stroke="#1f8fc0" stroke-width="2" stroke-dasharray="8 5"/>
<text x="90" y="272" font-size="12.5" font-weight="700" class="cyanTxt">ASSESSMENT ENGINE (ORCHESTRATOR)</text>
<text x="90" y="286" font-size="9.5" class="cap">assessment/engine.py :: run_assessment — ingest → scan → persist → score → evaluate → audit</text>

<!-- Box 1: Source ingestion -->
<rect x="130" y="290" width="200" height="100" rx="10" class="box"/>
<text x="230" y="316" font-size="12.5" text-anchor="middle" class="title">Source Ingestion &amp;</text>
<text x="230" y="332" font-size="12.5" text-anchor="middle" class="title">Safety Validation</text>
<text x="230" y="350" font-size="9.5" text-anchor="middle" class="cap">Fail-closed path allowlist</text>
<text x="230" y="363" font-size="9" text-anchor="middle" class="greenTxt">✓ hash-verified read-only scan</text>
<text x="230" y="378" font-size="8.5" text-anchor="middle" class="file">source_ingestion.py · path_validator.py</text>
<path d="M330,340 L350,340" class="flow"/>

<!-- Box 2: Scan orchestrator + 8 engines + domain mapping -->
<rect x="350" y="290" width="440" height="190" rx="10" class="box"/>
<text x="570" y="314" font-size="13" text-anchor="middle" class="title">Scan Orchestrator</text>
<text x="570" y="330" font-size="10.5" text-anchor="middle" class="cap">8 Deterministic Scanning Engines</text>
<!-- chip grid 4x2 -->
<g font-size="9.5" text-anchor="middle">
  <rect x="370" y="344" width="94" height="22" rx="11" fill="#eef2f6" stroke="#0b2545" stroke-width="1"/>
  <text x="417" y="359" class="navyTxt">Secret Exposure</text>
  <rect x="472" y="344" width="94" height="22" rx="11" fill="#eef2f6" stroke="#0b2545" stroke-width="1"/>
  <text x="519" y="359" class="navyTxt">PII Exposure</text>
  <rect x="574" y="344" width="94" height="22" rx="11" fill="#eef2f6" stroke="#0b2545" stroke-width="1"/>
  <text x="621" y="359" class="navyTxt">Unsafe Logging</text>
  <rect x="676" y="344" width="94" height="22" rx="11" fill="#eef2f6" stroke="#0b2545" stroke-width="1"/>
  <text x="723" y="359" class="navyTxt">Audit Gap</text>
  <rect x="370" y="374" width="94" height="22" rx="11" fill="#eef2f6" stroke="#0b2545" stroke-width="1"/>
  <text x="417" y="389" class="navyTxt">Broad Permission</text>
  <rect x="472" y="374" width="94" height="22" rx="11" fill="#eef2f6" stroke="#0b2545" stroke-width="1"/>
  <text x="519" y="389" class="navyTxt">Unsafe SQL</text>
  <rect x="574" y="374" width="94" height="22" rx="11" fill="#eef2f6" stroke="#0b2545" stroke-width="1"/>
  <text x="621" y="389" class="navyTxt">Insecure Config</text>
  <rect x="676" y="374" width="94" height="22" rx="11" fill="#eef2f6" stroke="#0b2545" stroke-width="1"/>
  <text x="723" y="389" class="navyTxt">Unsupported File</text>
</g>
<text x="570" y="411" font-size="8.5" text-anchor="middle" class="file">scanners/rules/*.py via scan_orchestrator.py</text>
<line x1="370" y1="420" x2="770" y2="420" stroke="#c7d0d9" stroke-width="1"/>
<text x="570" y="438" font-size="11" text-anchor="middle" font-weight="700" class="navyTxt">+ Banking-Domain Mapping</text>
<text x="570" y="453" font-size="9.5" text-anchor="middle" class="cap">16 approved domains · confidence + evidence</text>
<text x="570" y="467" font-size="8.5" text-anchor="middle" class="file">domain_mapper.py</text>
<path d="M790,340 L810,340" class="flow"/>

<!-- Box 3: Scoring engine -->
<rect x="810" y="290" width="200" height="100" rx="10" class="box"/>
<text x="910" y="326" font-size="13" text-anchor="middle" class="title">Scoring Engine</text>
<text x="910" y="346" font-size="9.5" text-anchor="middle" class="cap">Severity + confidence weighted;</text>
<text x="910" y="360" font-size="9.5" text-anchor="middle" class="cap">unevaluated → INSUFFICIENT_EVIDENCE</text>
<text x="910" y="378" font-size="8.5" text-anchor="middle" class="file">scoring/engine.py</text>
<path d="M1010,340 L1030,340" class="flow"/>

<!-- Box 4: Control evaluation -->
<rect x="1030" y="290" width="200" height="100" rx="10" class="box"/>
<text x="1130" y="326" font-size="13" text-anchor="middle" class="title">Control Evaluation</text>
<text x="1130" y="346" font-size="9.5" text-anchor="middle" class="cap">Per domain/control:</text>
<text x="1130" y="360" font-size="9.5" text-anchor="middle" class="cap">satisfied / gap / insufficient evidence</text>
<text x="1130" y="378" font-size="8.5" text-anchor="middle" class="file">assessment/evaluators/control_evaluator.py</text>

<!-- Down arrows into persistence strip (only the 3 stages that call a repository write) -->
<path d="M570,480 L570,540" class="flow"/>
<path d="M910,390 L910,540" class="flow"/>
<path d="M1130,390 L1130,540" class="flow"/>

<!-- Persistence strip -->
<rect x="70" y="540" width="1220" height="60" rx="10" fill="#eef2f6" stroke="#0b2545" stroke-width="1.75"/>
<text x="680" y="564" font-size="12.5" text-anchor="middle" font-weight="700" class="navyTxt">Repository / Persistence Layer</text>
<text x="680" y="580" font-size="9.5" text-anchor="middle" class="file">storage/db/repositories.py — ScanRepository · ScoringRepository · ControlEvaluationRepository · GovernanceRepository · AuditRepository</text>

<!-- Persistence <-> DB -->
<path d="M680,600 L680,650" class="flowBi"/>
<path d="M580,650 a100,16 0 0,0 200,0 v70 a100,16 0 0,1 -200,0 z" fill="#ffffff" stroke="#0b2545" stroke-width="1.5"/>
<ellipse cx="680" cy="650" rx="100" ry="16" fill="none" stroke="#0b2545" stroke-width="1.5"/>
<text x="680" y="694" font-size="12.5" text-anchor="middle" font-weight="700" class="navyTxt">PostgreSQL</text>
<text x="680" y="709" font-size="10" text-anchor="middle" class="cap">(pgvector-enabled)</text>
<text x="680" y="742" font-size="9" text-anchor="middle" class="file">storage/db/session.py · deployment/docker-compose.yml</text>

<!-- Persistence <-> Governance -->
<path d="M1055,600 L1055,640" class="flowBi"/>
<rect x="850" y="640" width="410" height="100" rx="10" class="box"/>
<text x="1055" y="664" font-size="12.5" text-anchor="middle" class="title">Governance Review &amp; Finalization Gate</text>
<text x="1055" y="682" font-size="9.5" text-anchor="middle" class="cap">Human review · justified score override</text>
<text x="1055" y="696" font-size="9" text-anchor="middle" class="cap">Blocks finalization while high/critical-risk findings remain pending review</text>
<text x="1055" y="712" font-size="8.5" text-anchor="middle" class="file">governance/approval_workflow.py</text>

<!-- Governance <-> UI -->
<path d="M1055,740 L1055,810" class="flowBi"/>

<!-- UI <-> Persistence (run assessment / load scan / read results) -->
<path d="M250,810 L250,600" class="flowBi"/>
<text x="258" y="700" font-size="9" class="edge">run assessment ⇄</text>
<text x="258" y="712" font-size="9" class="edge">load scan / read results</text>

<!-- UI box -->
<rect x="90" y="810" width="1200" height="90" rx="12" class="box"/>
<text x="690" y="834" font-size="13" text-anchor="middle" class="title">UI (Streamlit)</text>
<text x="690" y="852" font-size="9.5" text-anchor="middle" class="cap">Assessment workflow · Domain Scores · Findings &amp; Evidence · Control Evaluations · Governance</text>
<text x="690" y="866" font-size="9.5" text-anchor="middle" class="cap">Export (JSON / Markdown / CSV) · Help / System Information panel</text>
<text x="690" y="882" font-size="8.5" text-anchor="middle" class="file">ui/streamlit_app.py · ui/services/assessment_service.py</text>

<!-- Audit ledger -->
<rect x="1310" y="250" width="170" height="560" rx="14" fill="#f4f6f8" stroke="#0b2545" stroke-width="1.75"/>
<text x="1395" y="274" font-size="11" text-anchor="middle" font-weight="700" class="navyTxt">APPEND-ONLY</text>
<text x="1395" y="288" font-size="11" text-anchor="middle" font-weight="700" class="navyTxt">AUDIT TRAIL</text>
<text x="1395" y="302" font-size="8.5" text-anchor="middle" class="file">governance/audit_trail.py</text>
<text x="1395" y="314" font-size="8.5" text-anchor="middle" class="file">+ AuditRepository</text>
<text x="1395" y="329" font-size="8" text-anchor="middle" class="cap">One event per stage —</text>
<text x="1395" y="341" font-size="8" text-anchor="middle" class="cap">no update/delete path</text>
<line x1="1325" y1="350" x2="1465" y2="350" stroke="#c7d0d9" stroke-width="1"/>
<text x="1330" y="368" font-size="9" class="grayTxt">• scan_persisted</text>
<text x="1330" y="384" font-size="9" class="grayTxt">• scoring_completed</text>
<text x="1330" y="400" font-size="8.5" class="grayTxt">• control_evaluation_completed</text>
<text x="1330" y="416" font-size="8.5" class="grayTxt">• assessment_completed</text>
<text x="1330" y="432" font-size="8.5" class="grayTxt">• governance review /</text>
<text x="1340" y="444" font-size="8.5" class="grayTxt">override action</text>
<text x="1330" y="460" font-size="8.5" class="grayTxt">• agent advisory action</text>
<rect x="1330" y="475" width="140" height="24" rx="12" fill="#e6f4ea" stroke="#1f7a45" stroke-width="1"/>
<text x="1400" y="491" font-size="8.5" text-anchor="middle" font-weight="700" class="greenTxt">APPEND-ONLY · VERIFIED</text>

<!-- Stage/governance events into ledger -->
<path d="M1290,558 L1296,558 L1296,400 L1310,400" class="append"/>
<path d="M1260,690 L1304,690 L1304,460 L1310,460" class="append"/>
<text x="1180" y="560" font-size="9" text-anchor="middle" class="edge">stage events</text>
<text x="1285" y="624" font-size="8" text-anchor="middle" class="edge">review/override events</text>

<!-- Ledger -> UI read-only -->
<path d="M1395,810 L1395,850 L1291,850" class="readback"/>
<text x="1350" y="864" font-size="8.5" text-anchor="middle" class="grayTxt">read audit events (Governance tab)</text>

<!-- Legend -->
<g font-size="10.5">
  <line x1="70" y1="948" x2="110" y2="948" class="flow"/>
  <text x="118" y="952" class="cap">Deterministic data flow / persistence write</text>

  <line x1="430" y1="948" x2="470" y2="948" class="append"/>
  <text x="478" y="952" class="cap">Append-only audit event (write-once, no update/delete)</text>

  <line x1="900" y1="948" x2="940" y2="948" class="advisory"/>
  <text x="948" y="952" class="cyanTxt">Read-only / advisory-only (crosses the AI boundary)</text>

  <rect x="1330" y="940" width="16" height="16" rx="3" fill="none" stroke="#1f8fc0" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="1352" y="952" class="cap">Orchestration boundary (Assessment Engine)</text>

  <text x="70" y="984" font-size="9" class="grayTxt">Diagram reflects the repository state at the time of authoring; the implementation files listed are the source of truth. Not a production deployment topology.</text>
</g>

<!-- ============================= -->
<!-- Optional AI Advisory Layer    -->
<!-- ============================= -->
<rect x="1520" y="250" width="360" height="460" rx="16" fill="#f5f8fa" stroke="#1f8fc0" stroke-width="2.25" stroke-dasharray="9 6"/>
<text x="1700" y="280" font-size="14" text-anchor="middle" font-weight="700" class="navyTxt">OPTIONAL AI ADVISORY LAYER</text>
<text x="1700" y="298" font-size="11" text-anchor="middle" font-weight="700" class="cyanTxt" letter-spacing="0.5">ADVISORY ONLY</text>
<text x="1700" y="314" font-size="9.5" text-anchor="middle" class="cap">No write access to Findings, Scores,</text>
<text x="1700" y="327" font-size="9.5" text-anchor="middle" class="cap">Control Evaluations, or Audit/Compliance state</text>
<line x1="1545" y1="340" x2="1855" y2="340" stroke="#c7d0d9" stroke-width="1"/>

<rect x="1560" y="360" width="300" height="60" rx="8" class="box"/>
<text x="1710" y="382" font-size="12" text-anchor="middle" class="title">Context Sanitizer</text>
<text x="1710" y="398" font-size="9.5" text-anchor="middle" class="file">agents/sanitizer.py — minimizes &amp; masks context</text>

<path d="M1680,420 L1638,452" class="flow"/>
<path d="M1740,420 L1782,452" class="flow"/>

<rect x="1560" y="452" width="145" height="70" rx="8" fill="#ffffff" stroke="#1f7a45" stroke-width="1.5"/>
<text x="1632" y="472" font-size="11" text-anchor="middle" class="title">Local Agent</text>
<text x="1632" y="486" font-size="9" text-anchor="middle" class="cap">(default, offline)</text>
<text x="1632" y="500" font-size="8.5" text-anchor="middle" class="file">local_agent.py</text>

<rect x="1715" y="452" width="145" height="70" rx="8" fill="#ffffff" stroke="#8a97a3" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="1787" y="472" font-size="11" text-anchor="middle" class="title">External Provider</text>
<text x="1787" y="486" font-size="8.5" text-anchor="middle" class="cap">optional · disabled by default</text>
<text x="1787" y="500" font-size="8" text-anchor="middle" class="file">*_adapter.py — send() stub</text>

<path d="M1632,522 L1665,558" class="flow"/>
<path d="M1787,522 L1755,558" class="flow"/>

<rect x="1560" y="558" width="300" height="70" rx="8" class="box"/>
<text x="1710" y="580" font-size="12" text-anchor="middle" class="title">Agent Service</text>
<text x="1710" y="596" font-size="9" text-anchor="middle" class="cap">agents/agent_service.py — explain finding · summarize domain ·</text>
<text x="1710" y="608" font-size="9" text-anchor="middle" class="cap">answer question · executive summary — always advisory</text>

<path d="M1710,628 L1710,642" class="flow"/>
<rect x="1610" y="642" width="200" height="24" rx="12" fill="#e6f4ea" stroke="#1f7a45" stroke-width="1"/>
<text x="1710" y="658" font-size="9" text-anchor="middle" font-weight="700" class="greenTxt">ADVISORY OUTPUT ONLY</text>

<!-- Boundary-crossing arrows -->
<path d="M1290,585 L1505,585 L1505,593 L1520,593" class="advisory"/>
<text x="1400" y="572" font-size="8.5" text-anchor="middle" class="cyanTxt">read-only fetch of persisted Finding/Score rows</text>
<text x="1400" y="605" font-size="8" text-anchor="middle" class="grayTxt">(ui/services/agent_ui_service.py)</text>

<path d="M1610,654 L1494,654 L1494,460 L1480,460" class="advisory"/>
<rect x="1502" y="495" width="20" height="180" fill="#f5f8fa"/>
<text x="1512" y="585" font-size="8.5" text-anchor="middle" class="cyanTxt" transform="rotate(-90 1512 585)">advisory output → AuditEvent only</text>

<path d="M1150,810 L1150,750 L1700,750 L1700,710" class="advisory"/>
<text x="1420" y="744" font-size="8.5" text-anchor="middle" class="cyanTxt">"AI Assistant (Optional)" tab — user-triggered</text>

</svg>
